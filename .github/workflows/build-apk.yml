name: Build APK
on:
  push:
    branches: [master]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - run: chmod +x gradlew
      - run: ./gradlew assembleRelease
      - run: mv app/build/outputs/apk/release/*.apk ZTimer.apk
      - uses: actions/upload-artifact@v4
        with:
          name: ZTimer-apk
          path: ZTimer.apk
